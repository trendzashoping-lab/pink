<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pink Secret</title>
  <style>
    :root{
      --bg:#0b0c10; --card:#15161b; --muted:#9aa4b5; --text:#eef2f7;
      --brand:#ff4fb0; --accent:#59d0ff; --line:#242935; --ok:#20c997;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial;
      color:var(--text); background:linear-gradient(180deg,#0a0b11 0%, #0f1220 100%);
      min-height:100vh;
    }
    header{
      position:sticky; top:0; z-index:5;
      background:rgba(10,11,17,.7); backdrop-filter:saturate(180%) blur(10px);
      border-bottom:1px solid var(--line);
    }
    .wrap{max-width:1200px; margin:auto; padding:12px 18px;}
    .row-between{display:flex; align-items:center; justify-content:space-between; gap:12px}
    .logo{display:flex; align-items:center; gap:10px; font-weight:800}
    .logo img{width:28px; height:28px; border-radius:8px}
    .pill{font-size:13px; color:var(--muted)}
    .search{flex:1}
    .search input{
      width:100%; padding:10px 12px; border-radius:10px; outline:none;
      background:#0f1320; color:var(--text); border:1px solid var(--line)
    }
    main{max-width:1200px; margin:18px auto; padding:0 18px}
    .grid{
      display:grid; grid-template-columns:repeat(2,1fr); gap:18px;
    }
    @media (min-width:1024px){ .grid{grid-template-columns:repeat(3,1fr)} }
    .card{
      background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden;
      display:flex; flex-direction:column; min-height:360px;
    }
    .thumb{
      width:100%; height:260px; object-fit:cover; display:block;
      background:#1b1e2b;
    }
    .pad{padding:12px 14px}
    .title{font-weight:800}
    .muted{color:var(--muted); font-size:13px}
    .price{color:var(--ok); font-weight:900}
    .row-right{text-align:right}
    .qty{display:inline-flex; gap:8px; align-items:center}
    .btn{
      padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:#111522; color:var(--text);
      cursor:pointer;
    }
    .btn.primary{background:var(--brand); border-color:transparent; color:white}
    .btn.ghost{background:transparent}
    .cart-btn{position:relative}
    .cart-badge{
      position:absolute; right:-8px; top:-8px; background:var(--brand); color:#fff; border-radius:999px;
      font-size:12px; padding:2px 7px; border:1px solid #0006
    }

    /* 侧栏面板（详情 / 购物车） */
    .sheet{
      position:fixed; top:0; right:0; bottom:0; width:720px; max-width:100%;
      transform:translateX(100%); transition:.28s ease; background:#0d0f18; border-left:1px solid var(--line);
      display:flex; flex-direction:column; z-index:20;
    }
    .sheet.show{ transform:translateX(0) }
    .sheet .head{
      position:sticky; top:0; padding:14px 16px; background:#0d0f18; border-bottom:1px solid var(--line);
      display:flex; align-items:center; justify-content:space-between; gap:10px
    }
    .sheet .body{ padding:16px; overflow:auto }
    .kv{ display:grid; grid-template-columns: 1fr 1fr; gap:16px }
    @media (max-width:700px){ .kv{grid-template-columns:1fr} }
    .kv img{ width:100%; height:420px; object-fit:cover; border-radius:12px; border:1px solid var(--line) }
    .field{ display:flex; align-items:center; gap:8px; margin:10px 0 }
    .field input{
      flex:1; padding:10px 12px; border-radius:10px; background:#0f1320; color:var(--text); border:1px solid var(--line)
    }
    .list .item{
      display:grid; grid-template-columns:80px 1fr auto; gap:12px; padding:10px 0;
      border-bottom:1px dashed #ffffff10;
    }
    .list .item img{ width:80px; height:80px; object-fit:cover; border-radius:10px; border:1px solid var(--line) }
    .mask{ position:fixed; inset:0; background:#0008; display:none; z-index:15 }
  </style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="row-between">
      <div class="logo">
        <img src="https://i.postimg.cc/3NNt56LQ/pink.png" alt="Pink Secret" />
        Pink Secret
        <span class="pill">女性内衣 · 轻奢精选</span>
      </div>
      <div class="search" style="max-width:420px">
        <input id="search" type="search" placeholder="搜索：名称 / 分类 / 描述..." />
      </div>
      <button id="openCart" class="btn cart-btn">购物车 <span id="cartCount" class="cart-badge">0</span></button>
    </div>
  </div>
</header>

<main>
  <div id="grid" class="grid"></div>
</main>

<!-- 详情面板 -->
<aside id="detail" class="sheet" aria-hidden="true">
  <div class="head">
    <div id="dTitle">商品详情</div>
    <button id="dClose" class="btn">关闭</button>
  </div>
  <div class="body">
    <div class="kv">
      <img id="dImg" src="" alt="">
      <div>
        <div class="title" id="dName"></div>
        <div class="muted" id="dCate"></div>
        <div class="muted" id="dDesc" style="margin-top:6px"></div>
        <div class="field">
          <label for="dPrice">价格 (RM)：</label>
          <input id="dPrice" type="number" min="0" step="0.01" placeholder="在此输入价格">
        </div>
        <div style="margin-top:10px">
          <button id="savePrice" class="btn">保存价格</button>
          <button id="addToCartBtn" class="btn primary">加入购物车</button>
        </div>
      </div>
    </div>
  </div>
</aside>
<div id="detailMask" class="mask"></div>

<!-- 购物车面板 -->
<aside id="cart" class="sheet" aria-hidden="true">
  <div class="head">
    <div>购物车</div>
    <button id="cClose" class="btn">关闭</button>
  </div>
  <div class="body">
    <div id="cartList" class="list"></div>
    <div class="row-between" style="margin-top:12px">
      <div class="muted">小计</div>
      <div id="cSub" class="price">RM 0.00</div>
    </div>
    <div class="row-between" style="margin-top:8px">
      <div class="muted">合计</div>
      <div id="cTotal" class="price">RM 0.00</div>
    </div>
  </div>
</aside>
<div id="cartMask" class="mask"></div>

<script>
/* =============== 图片映射（你的 20 张图） =============== */
const IMG = {
  1:  'https://i.postimg.cc/vBZGYsSD/babydoll01.jpg',
  2:  'https://i.postimg.cc/wjYHtJbC/chemise02.jpg',
  3:  'https://i.postimg.cc/3RqQ3Dvb/bralette03.jpg',
  4:  'https://i.postimg.cc/wxS3V1GV/corset04.jpg',
  5:  'https://i.postimg.cc/6pK3kDw4/teddy05.jpg',
  6:  'https://i.postimg.cc/0Qz2GvGF/babydoll06.jpg',
  7:  'https://i.postimg.cc/k4LMfHf4/bralette07.jpg',
  8:  'https://i.postimg.cc/L6K6PrJQ/garterset08.jpg',
  9:  'https://i.postimg.cc/bwqyCkHQ/chemise09.jpg',
  10: 'https://i.postimg.cc/j5ntwXtr/robe10.jpg',
  11: 'https://i.postimg.cc/hv9nMtXy/bikiniset11.jpg',
  12: 'https://i.postimg.cc/90j54HLG/teddy12.jpg',
  13: 'https://i.postimg.cc/zG2sCgdD/babydoll13.jpg',
  14: 'https://i.postimg.cc/DztRDKkt/corset14.jpg',
  15: 'https://i.postimg.cc/x1ZZJSCc/bralette15.jpg',
  16: 'https://i.postimg.cc/3RXfc4Zv/chemise16.jpg',
  17: 'https://i.postimg.cc/RhGsvkyC/robe17.jpg',
  18: 'https://i.postimg.cc/pTJkZN2Q/teddy18.jpg',
  19: 'https://i.postimg.cc/Vs4D0cZm/garterset19.jpg',
  20: 'https://i.postimg.cc/7ZJVRJHZ/bikiniset20.jpg'
};

/* =============== 数据：20 个商品（初始价格为空） =============== */
const PRODUCTS = [
  {id:1,  name:'Babydoll Grey', type:'Babydoll', img:IMG[1],  desc:'A delicate lace babydoll with soft sheer fabric, perfect for a romantic night.'},
  {id:2,  name:'Chemise Red',  type:'Chemise',  img:IMG[2],  desc:'A silky smooth chemise with elegant straps, combining comfort and allure.'},
  {id:3,  name:'Bralette Light Blue', type:'Bralette', img:IMG[3],  desc:'A chic lace bralette offering both comfort and sensual charm.'},
  {id:4,  name:'Corset Black',   type:'Corset',   img:IMG[4],  desc:'A classic corset with boning support, designed to enhance your curves beautifully.'},
  {id:5,  name:'Teddy Red',    type:'Teddy',    img:IMG[5],  desc:'A one-piece lace teddy with bold cutouts, playful yet seductive.'},
  {id:6,  name:'Babydoll White', type:'Babydoll', img:IMG[6],  desc:'Sheer mesh babydoll with ribbon details, feminine and flirtatious.'},
  {id:7,  name:'Bralette Black/White', type:'Bralette', img:IMG[7],  desc:'A minimal lace bralette with soft lining, stylish for day or night.'},
  {id:8,  name:'Garter Set Black', type:'Garter Set', img:IMG[8], desc:' Complete lace garter set with matching stockings, a true statement of elegance.'},
  {id:9,  name:'Chemise Dark Blue',  type:'Chemise',  img:IMG[9],  desc:'Lightweight satin chemise with lace accents, comfortable and enticing.'},
  {id:10, name:'Robe Pink',     type:'Robe',     img:IMG[10], desc:' A sheer robe with satin trim, perfect as a sensual cover-up.'},
  {id:11, name:'Bikini Set Black', type:'Bikini Set', img:IMG[11], desc:'Playful lace bikini set with adjustable straps, bold yet comfortable.'},
  {id:12, name:'Teddy Sexy Blue',    type:'Teddy',    img:IMG[12], desc:'Elegant lace teddy with plunging neckline, both daring and refined.'},
  {id:13, name:'Babydoll Random Clour', type:'Babydoll', img:IMG[13], desc:'Romantic babydoll with lace cups and flowing sheer skirt.'},
  {id:14, name:'Corset Dark Red',   type:'Corset',   img:IMG[14], desc:'Lace corset with intricate embroidery, adding a touch of luxury.'},
  {id:15, name:'Bralette Pink', type:'Bralette', img:IMG[15], desc:'Soft bralette with floral lace, perfect for layering or intimate wear.'},
  {id:16, name:'Chemise Black',  type:'Chemise',  img:IMG[16], desc:' Satin chemise with deep V-neck and lace trim, sleek and sensual.'},
  {id:17, name:'Robe Black',     type:'Robe',     img:IMG[17], desc:'A silk-like robe with lace sleeves, adding elegance to your lingerie set.'},
  {id:18, name:'Teddy White Blue',    type:'Teddy',    img:IMG[18], desc:'Bold teddy with sheer panels and lace details, made to impress.'},
  {id:19, name:'Garter Set Red Black', type:'Garter Set', img:IMG[19], desc:'Seductive garter belt set with lace details and matching panties.'},
  {id:20, name:'Bikini Set Black', type:'Bikini Set', img:IMG[20], desc:'Delicate lace bikini set with sheer mesh accents, chic and playful.'}
].map(p => ({ ...p, price: loadPrice(p.id) })); // 读本地已保存价格（可为空）

/* =============== 小工具 =============== */
const RM = n => 'RM ' + (+n).toFixed(2);
const grid = document.getElementById('grid');
const search = document.getElementById('search');

/* =============== 渲染卡片 =============== */
function productCard(p){
  const el = document.createElement('article');
  el.className = 'card';
  // 纯净：只用真实图片，不做粉色占位回退
  const img = document.createElement('img');
  img.className = 'thumb';
  img.alt = p.name;
  img.loading = 'lazy';
  img.src = p.img;

  const pad = document.createElement('div');
  pad.className = 'pad';
  pad.innerHTML = [
    `<div class="row-between">`,
      `<div class="pill">Women · ${p.type}</div>`,
      `<div class="price">${p.price==null ? '请设置价格' : RM(p.price)}</div>`,
    `</div>`,
    `<div class="title" style="margin-top:6px">${p.name}</div>`,
    `<div class="muted" style="margin-top:6px">${p.desc||''}</div>`,
    `<div class="row-right" style="margin-top:10px">`,
      `<button class="btn" data-act="detail" data-id="${p.id}">查看详情</button>`,
      `<button class="btn primary" data-act="add" data-id="${p.id}" style="margin-left:8px">加入购物车</button>`,
    `</div>`
  ].join('');

  el.appendChild(img);
  el.appendChild(pad);

  el.addEventListener('click', (e)=>{
    const b = e.target.closest('button');
    if(!b) return;
    const id = +b.dataset.id;
    if(b.dataset.act==='detail') openDetail(id);
    if(b.dataset.act==='add')    addToCart(id);
  });

  return el;
}

/* =============== 列表过滤与渲染 =============== */
function applyFilters(list){
  let out = list.slice();
  const q = search.value.trim().toLowerCase();
  if(q){
    out = out.filter(x => (x.name+x.type+x.desc).toLowerCase().includes(q));
  }
  return out;
}
function render(){
  const list = applyFilters(PRODUCTS);
  grid.innerHTML = '';
  list.forEach(p => grid.appendChild(productCard(p)));
}
search.addEventListener('input', render);

/* =============== 详情（设置价格） =============== */
const detail = document.getElementById('detail');
const detailMask = document.getElementById('detailMask');
const dClose = document.getElementById('dClose');
const dImg = document.getElementById('dImg');
const dTitle = document.getElementById('dTitle');
const dName = document.getElementById('dName');
const dCate = document.getElementById('dCate');
const dDesc = document.getElementById('dDesc');
const dPrice = document.getElementById('dPrice');
const savePriceBtn = document.getElementById('savePrice');
const addToCartBtn = document.getElementById('addToCartBtn');
let currentId = null;

function openDetail(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
  currentId = id;
  dImg.src = p.img; dImg.alt = p.name;
  dTitle.textContent = '商品详情';
  dName.textContent = p.name;
  dCate.textContent = `Women · ${p.type}`;
  dDesc.textContent = p.desc||'';
  dPrice.value = (p.price==null ? '' : p.price);
  detail.classList.add('show'); detailMask.style.display='block';
  addToCartBtn.onclick = ()=>addToCart(id);
}
dClose.onclick = ()=>{ detail.classList.remove('show'); detailMask.style.display='none'; };
detailMask.onclick = dClose.onclick;

savePriceBtn.onclick = ()=>{
  if(currentId==null) return;
  const val = dPrice.value.trim();
  if(val==='' || isNaN(+val)){ alert('请输入数字价格'); return; }
  const num = +(+val).toFixed(2);
  savePrice(currentId, num);
  const p = PRODUCTS.find(x=>x.id===currentId); if(p) p.price = num;
  render(); updateCartUI();
  alert('价格已保存');
};

/* =============== 购物车 =============== */
const cart = document.getElementById('cart');
const cartMask = document.getElementById('cartMask');
const cClose = document.getElementById('cClose');
const openCartBtn = document.getElementById('openCart');
const cartList = document.getElementById('cartList');
const cSub = document.getElementById('cSub');
const cTotal = document.getElementById('cTotal');
const cartCount = document.getElementById('cartCount');

openCartBtn.onclick = ()=>{ cart.classList.add('show'); cartMask.style.display='block'; updateCartUI(); };
cClose.onclick = ()=>{ cart.classList.remove('show'); cartMask.style.display='none'; };
cartMask.onclick = cClose.onclick;

let CART = loadCart();

function addToCart(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
  if(p.price==null){ openDetail(id); alert('请先为该商品设置价格 (RM)。'); return; }
  const found = CART.find(x=>x.id===id);
  if(found) found.qty += 1; else CART.push({id, qty:1});
  saveCart(); updateCartUI();
}
function changeQty(id, delta){
  const it = CART.find(x=>x.id===id); if(!it) return;
  it.qty += delta;
  if(it.qty<=0) CART = CART.filter(x=>x.id!==id);
  saveCart(); updateCartUI();
}
function removeItem(id){
  CART = CART.filter(x=>x.id!==id);
  saveCart(); updateCartUI();
}
function updateCartUI(){
  cartList.innerHTML = '';
  let sub = 0;
  CART.forEach(it=>{
    const p = PRODUCTS.find(x=>x.id===it.id); if(!p) return;
    const line = p.price * it.qty;
    sub += line;
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `
      < img src="${p.img}" alt="${p.name}">
      <div>
        <div style="font-weight:800">${p.name}</div>
        <div class="muted">Women · ${p.type}</div>
      </div>
      <div style="text-align:right">
        <div class="price">${RM(line)}</div>
        <div class="qty" style="margin-top:6px">
          <button aria-label="减少" onclick="changeQty(${it.id},-1)">-</button>
          <span>${it.qty}</span>
          <button aria-label="增加" onclick="changeQty(${it.id},1)">+</button>
          <button class="btn ghost" style="margin-left:8px" onclick="removeItem(${it.id})">移除</button>
        </div>
      </div>`;
    cartList.appendChild(row);
  });
  cSub.textContent = RM(sub);
  cTotal.textContent = RM(sub);
  cartCount.textContent = CART.reduce((s,i)=>s+i.qty,0);
}

/* =============== 本地存储（购物车 & 价格） =============== */
function loadCart(){
  try{
    const s = localStorage.getItem('PS_CART');
    if(!s) return [];
    if(s[0] !== '[') return [];
    return JSON.parse(s);
  }catch(e){ return []; }
}
function saveCart(){
  localStorage.setItem('PS_CART', JSON.stringify(CART));
}
function loadPrice(id){
  try{
    const map = JSON.parse(localStorage.getItem('PS_PRICES')||'{}');
    return map[id] ?? null;
  }catch(e){ return null; }
}
function savePrice(id, price){
  try{
    const map = JSON.parse(localStorage.getItem('PS_PRICES')||'{}');
    map[id] = price;
    localStorage.setItem('PS_PRICES', JSON.stringify(map));
  }catch(e){
    // fallback 写入一次
    localStorage.setItem('PS_PRICES', JSON.stringify({ [id]: price }));
  }
}

/* =============== 启动 =============== */
window.addEventListener('DOMContentLoaded', ()=>{
  render();
  updateCartUI();
});
</script>
</body>
</html>
